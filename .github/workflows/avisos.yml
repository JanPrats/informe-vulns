name: Avisos por correo de CVEs nuevas

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # cada 15 minutos, fuera de los minutos redondos (GitHub los satura y los retrasa o descarta)
  workflow_dispatch:
    inputs:
      probar:
        description: "Enviar un correo de prueba con las 3 CVEs más recientes"
        type: boolean
        default: false
      cves:
        description: "Opcional, solo para la prueba: CVEs concretas del histórico (separadas por comas). También se publican en prueba.json para probar n8n"
        type: string
        default: ""

permissions:
  contents: write   # para publicar novedades.json en la rama «datos»

concurrency:
  group: avisos
  cancel-in-progress: false

jobs:
  avisar:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Recuerda qué CVEs ya se avisaron y la caché de NVD entre ejecuciones.
      # Solo se guarda si la ejecución termina bien: si el correo falla, se reintenta en la siguiente.
      - uses: actions/cache@v4
        with:
          path: |
            .estado_avisos.json
            .cache_nvd_avisos.json
            .cache_cna.json
          key: avisos-${{ github.run_id }}
          restore-keys: avisos-

      # Aquí no hay ningún dato de clientes: el cruce con el inventario lo hace n8n, dentro de Logicalis.
      - name: Comprobar CVEs nuevas y avisar
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          AVISO_PARA: ${{ secrets.AVISO_PARA }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          INFORME_URL: https://janprats.github.io/informe-vulns/
          AVISO_FABRICANTES: ${{ vars.AVISO_FABRICANTES }}   # opcional: Settings > Secrets and variables > Actions > Variables
          CVES_PRUEBA: ${{ inputs.cves }}
        run: |
          if [ "${{ inputs.probar }}" = "true" ]; then
            if [ -n "$CVES_PRUEBA" ]; then python avisos.py --probar --cves "$CVES_PRUEBA" --novedades prueba.json; else python avisos.py --probar; fi
          else
            python avisos.py
          fi

      # novedades.json (y prueba.json en las pruebas) en la rama «datos», con un único commit que se reemplaza
      # cada vez. n8n lo lee de https://raw.githubusercontent.com/<repo>/datos/novedades.json
      - name: Publicar para n8n
        if: always() && (hashFiles('novedades.json') != '' || hashFiles('prueba.json') != '')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REMOTO="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if ! git clone -q --depth 1 --branch datos "$REMOTO" /tmp/datos 2>/dev/null; then
            mkdir -p /tmp/datos && git -C /tmp/datos init -q -b datos && git -C /tmp/datos remote add origin "$REMOTO"
          fi
          for f in novedades.json prueba.json; do [ -f "$f" ] && cp -f "$f" /tmp/datos/; done
          cd /tmp/datos
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan nueva
          git add -A
          git commit -qm "Datos para n8n"
          git push -qf origin nueva:datos
