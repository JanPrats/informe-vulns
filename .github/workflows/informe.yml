name: Generar y publicar informe

on:
  schedule:
    - cron: "17 5 * * *"    # todos los días a las 05:17 UTC (07:17 en Madrid en verano, 06:17 en invierno)
  workflow_dispatch:         # botón "Run workflow" para lanzarlo a mano
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 90       # la primera ejecución construye el archivo de 1 año; las siguientes tardan segundos
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Reutiliza la caché de NVD/CVE.org entre ejecuciones para descargar solo lo nuevo
      - uses: actions/cache@v4
        with:
          path: |
            .cache_nvd.json
            .cache_cna.json
            .cache_archivo.json
            .cache_avisos.json
          key: cache-vulns-${{ github.run_id }}
          restore-keys: cache-vulns-

      - name: Generar informe
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}   # opcional: Settings > Secrets and variables > Actions
        run: |
          mkdir -p public
          python vulns_perimetrales.py --dias 7 --historico 30 --archivo 365 --html public/index.html --csv public/informe.csv

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  publicar:
    needs: generar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
